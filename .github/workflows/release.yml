name: Release

on:
  push:
    tags:
      - 'v*'
  # 允许在 Actions 页面手动触发
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v0.1.0（需已存在）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release VSIX
    runs-on: ubuntu-latest

    # 在 job 级别暴露 secrets，供后续步骤的 if 条件判断是否已配置
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version info
        id: vars
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          echo "vsix=flutter-ohos-toolkit-${REF#v}.vsix" >> "$GITHUB_OUTPUT"

      - name: Check package.json version matches tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ steps.vars.outputs.version }}" ]; then
            echo "::error::package.json 版本 ($PKG_VERSION) 与 tag (${{ steps.vars.outputs.version }}) 不一致"
            exit 1
          fi

      # 快速失败：未配置 OVSX_PAT 时直接报错，避免白跑构建与发 Release
      - name: Verify Open VSX token
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo "::error::缺少 OVSX_PAT secret，无法自动发布到 Open VSX。请在仓库 Settings → Secrets and variables → Actions 添加 OVSX_PAT 后重试。"
            exit 1
          fi

      - name: Build extension
        run: npm run compile

      - name: Package VSIX
        run: npm run package

      # 幂等：Release 已存在时只覆盖上传 VSIX，避免重跑时报
      # "a release with the same tag name already exists" 而中断后续发布步骤。
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          VSIX="./${{ steps.vars.outputs.vsix }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating the VSIX asset only."
            gh release upload "$TAG" "$VSIX" --clobber
          else
            gh release create "$TAG" "$VSIX" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi

      # ----------------------------------------------------------------------
      # 可选：发布到 VS Code Marketplace（需在仓库 Secrets 配置 VSCE_PAT）
      # ----------------------------------------------------------------------
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npm run publish

      # ----------------------------------------------------------------------
      # 自动发布到 Open VSX（需在仓库 Secrets 配置 OVSX_PAT，缺失时上面的校验会提前报错）
      # ----------------------------------------------------------------------
      - name: Publish to Open VSX
        run: npx --yes ovsx publish ./${{ steps.vars.outputs.vsix }} --skip-duplicate
