name: Release

on:
  push:
    tags:
      - 'v*'
  # 允许在 Actions 页面手动触发
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v0.1.0（需已存在）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release VSIX
    runs-on: ubuntu-latest

    # 在 job 级别暴露 secrets，供后续步骤的 if 条件判断是否已配置
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version info
        id: vars
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          echo "vsix=flutter-ohos-toolkit-${REF#v}.vsix" >> "$GITHUB_OUTPUT"

      - name: Check package.json version matches tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ steps.vars.outputs.version }}" ]; then
            echo "::error::package.json 版本 ($PKG_VERSION) 与 tag (${{ steps.vars.outputs.version }}) 不一致"
            exit 1
          fi

      - name: Build extension
        run: npm run compile

      - name: Package VSIX
        run: npm run package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.vars.outputs.tag }}" \
            ./${{ steps.vars.outputs.vsix }} \
            --title "${{ steps.vars.outputs.tag }}" \
            --generate-notes \
            --verify-tag

      # ----------------------------------------------------------------------
      # 可选：发布到 VS Code Marketplace（需在仓库 Secrets 配置 VSCE_PAT）
      # ----------------------------------------------------------------------
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npm run publish

      # ----------------------------------------------------------------------
      # 可选：发布到 Open VSX（需在仓库 Secrets 配置 OVSX_PAT）
      # ----------------------------------------------------------------------
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish ./${{ steps.vars.outputs.vsix }} --skip-duplicate
